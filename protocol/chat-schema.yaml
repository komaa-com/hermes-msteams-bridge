# =============================================================================
# StandIn managed chat relay protocol
# =============================================================================
# The wire contract for managed connection mode: StandIn provides the Teams bot
# and your agent never holds a Bot Framework credential.
#
# This is NOT the voice protocol. Voice is one WebSocket per live call; chat is
# request/response HTTP.
#
# TRANSPORT
#   in    POST {your managed chat URL}      body: InboundMessage
#   out   POST {reply URL StandIn gives you}  body: OutboundMessage
#   Both directions carry Content-Type: application/json; charset=utf-8.
#
# AUTH
#   X-StandIn-Timestamp   unix epoch MILLISECONDS
#   X-StandIn-Signature   lowercase hex HMAC-SHA256(secret, "{timestampMs}.{rawBody}")
#   The secret is your connection's key, issued by StandIn. Receivers MUST enforce
#   a +/- 5 minute replay window and MUST compare in constant time.
#
# EVOLUTION
#   Additive only. Unknown fields MUST be ignored; unknown enum values MUST NOT
#   be rejected (openEnum). schemaVersion is bumped only for a breaking change.
#
# Each implementation carries a drift-checked copy of this file, so the copies
# are byte-identical by design - edit them together.

protocol:
  name: standin-managed-chat
  version: 1
  doc: "Normalized chat relay between StandIn and your agent for managed connection mode. Your agent never sees a Bot Framework credential."

constants:
  - name: SCHEMA_VERSION
    value: 1
    doc: "Value every message carries in schemaVersion. Receivers accept any version they know and ignore unknown fields; they MUST NOT hard-fail on a higher minor shape."
  - name: REPLAY_WINDOW_MS
    value: 300000
    doc: "Accepted clock skew for the HMAC timestamp, both directions (+/- 5 minutes)."

enums:
  ChatScope:
    open: true
    values: [personal, groupChat, channel]
    doc: "Where the conversation lives. 'personal' is the 1:1 chat with the bot; 'groupChat' includes meeting chats; 'channel' is a STANDARD team channel (shared/private channels are out of scope). Open set: treat unknown as groupChat and relay normally."
  AttachmentKind:
    open: true
    values: [image, file, audio]
    doc: "'image' is an inline image (v1 supported). 'file' is a real file attachment: personal-chat files are v1, channel/group files are NOT relayed and arrive with relayable=false. 'audio' is a Teams voice message; the agent transcribes it when transcribeVoiceMessages is on, and otherwise treats it as any other attachment. Additive on an OPEN enum, so a peer that predates it relays the clip as an unknown kind rather than failing."
  ReplyKind:
    open: true
    values: [message, typing, error]
    doc: "'message' is normal content; 'typing' shows the Teams typing indicator and carries no text; 'error' renders the agent-unreachable/agent-error styling. Unknown kinds are treated as 'message'."

types:
  Sender:
    doc: "Who sent the inbound message. Resolved from the authenticated Teams activity, so it may be trusted without further checks."
    fields:
      - name: aadObjectId
        type: string
        optional: true
        nullable: true
        doc: "AAD object id of the sender in the bound tenant. Absent for anonymous/unknown identities; never fabricate one."
      - name: displayName
        type: string
        optional: true
        nullable: true
        doc: "Human-readable name as Teams reports it."
      - name: isGuest
        type: bool
        default: false
        doc: "True when the sender is a B2B guest in the bound tenant. Guests relay like members; the AGENT decides its own policy. FAIL-OPEN: false also means guest status could not be determined, so read it as 'not known to be a guest' rather than 'known to be a member'."
      - name: isLinkedOwner
        type: bool
        default: false
        doc: "True when this sender's Teams principal is linked to the StandIn account that owns the connection. Useful for the agent's own permissioning."

  Attachment:
    doc: "An inbound attachment, relayed BY REFERENCE on a short-lived signed URL, so the agent never needs a Teams token."
    fields:
      - name: kind
        type: string
        enum: AttachmentKind
        doc: "image | file (see AttachmentKind)."
      - name: name
        type: string
        optional: true
        nullable: true
        doc: "Original filename as Teams reported it, when present."
      - name: contentType
        type: string
        optional: true
        nullable: true
        doc: "MIME type, when Teams reported one."
      - name: sizeBytes
        type: long
        optional: true
        doc: "Size in bytes when known. A size cap applies before relaying; an oversize attachment arrives with relayable=false instead of a url."
      - name: url
        type: string
        optional: true
        nullable: true
        doc: "Signed, short-lived fetch URL. Absent when relayable is false. Agents must fetch within expiresAt and must not persist the URL itself."
      - name: expiresAt
        type: string
        optional: true
        nullable: true
        doc: "RFC3339 UTC instant after which url stops working."
      - name: relayable
        type: bool
        default: true
        doc: "False when the content was deliberately not relayed (too large, unsupported kind, or a channel/group file). The agent should tell the user rather than silently ignoring the attachment."

  InboundMessage:
    doc: "Inbound: one user message in a bound tenant's conversation. Already authenticated and resolved to your connection. Reserved bot commands are handled by StandIn and never arrive here."
    fields:
      - name: schemaVersion
        type: int
        doc: "SCHEMA_VERSION at the time of sending."
      - name: tenantId
        type: string
        doc: "The AUTHENTICATED Microsoft tenant id of the conversation. The agent may trust it; it is never taken from user input."
      - name: bindingId
        type: string
        doc: "Id of the StandIn connection this conversation resolved to. Stable across messages for a tenant; useful for the agent's own per-customer state."
      - name: conversationId
        type: string
        doc: "Stable Teams conversation id. The agent MUST echo it back on every reply so the gateway can address the right chat."
      - name: activityId
        type: string
        doc: "Id of the originating Teams activity. Idempotency key: a redelivery repeats this value, so agents must not double-process it. Also the replyToId a threaded reply targets."
      - name: scope
        type: string
        enum: ChatScope
        doc: "personal | groupChat | channel."
      - name: sender
        type: object:Sender
        doc: "Authenticated sender identity."
      - name: text
        type: string
        default: ""
        doc: "Message text as markdown, with the bot @mention already STRIPPED. In group/channel scope only mentioned messages are relayed. May be empty when the message carried only attachments."
      - name: mentions
        type: array:string
        optional: true
        doc: "Display names mentioned in the message other than the bot, in order of appearance."
      - name: attachments
        type: array:Attachment
        optional: true
        doc: "Inbound attachments; see Attachment. Absent or empty when there are none."
      - name: cardAction
        type: object
        optional: true
        nullable: true
        doc: "Submit payload of an agent card's Action.Submit, relayed verbatim (additive v1 field). text is empty on these messages; agents that predate the field may ignore them."
      - name: locale
        type: string
        optional: true
        nullable: true
        doc: "Teams client locale of the sender (e.g. 'en-GB'), when reported. Useful for the multilingual answer requirement."
      - name: timestamp
        type: string
        doc: "RFC3339 UTC instant the activity was received."

  OutboundMessage:
    doc: "Outbound: a reply, a typing indicator, or an error to render. StandIn performs the actual Teams send; the agent never holds a bot credential."
    fields:
      - name: schemaVersion
        type: int
        doc: "SCHEMA_VERSION at the time of sending."
      - name: tenantId
        type: string
        doc: "MUST equal the tenantId of the inbound message being answered. A mismatch is REJECTED (cross-tenant leak guard)."
      - name: conversationId
        type: string
        doc: "The conversation to send into; echo the inbound value."
      - name: replyToId
        type: string
        optional: true
        nullable: true
        doc: "Inbound activityId to thread this reply under. Omit for a standalone message in the conversation."
      - name: kind
        type: string
        enum: ReplyKind
        default: message
        doc: "message | typing | error."
      - name: text
        type: string
        optional: true
        nullable: true
        doc: "Markdown to send. Required for kind=message and kind=error; ignored for kind=typing. Streaming is NOT v1: buffer and send whole messages."
      - name: card
        type: object
        optional: true
        nullable: true
        doc: "An Adaptive Card payload to send instead of/alongside text. Cards are VALIDATED against an allowlist (schema version, no raw HTML, permitted action types, openUrl restricted to approved domains); a card that fails is rejected rather than forwarded."
      - name: idempotencyKey
        type: string
        optional: true
        nullable: true
        doc: "Agent-chosen key making a retried send safe. A duplicate (tenantId, conversationId, idempotencyKey) is dropped within the retention window."
      - name: systemNotice
        type: bool
        optional: true
        doc: "Reserved for StandIn control-plane notices (retire, connected, consent revoked). Set only by StandIn on its own authenticated endpoint, never by an agent: the agent-facing reply route does not read it."
