[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-msteams-bridge"
version = "0.5.0"
description = "Microsoft Teams Bridge for Hermes Agent: voice/video (Conversational Video Interface) plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "alaamh", email = "alaamh@outlook.com" }]
keywords = ["hermes", "hermes-agent", "microsoft-teams", "voice", "cvi", "plugin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Conferencing",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  # Hermes Agent itself is the host runtime (not on PyPI — install via its own
  # installer into the SAME environment). These are the only extra runtime deps.
  "aiohttp>=3.10",  # pre-auth HTTP/WS server: floor raised off 3.8 (request-smuggling / parser / static-route CVEs fixed by 3.9.2/3.9.4)
]

[project.urls]
Homepage = "https://github.com/komaa-com/hermes-msteams-bridge"
Repository = "https://github.com/komaa-com/hermes-msteams-bridge"
Issues = "https://github.com/komaa-com/hermes-msteams-bridge/issues"
Documentation = "https://komaa-com.github.io/hermes-msteams-bridge/"

[project.optional-dependencies]
# Faster audio resampling (pure-Python fallback is used when absent).
numpy = ["numpy>=1.21"]
# show_file document rendering: pypdfium2 (PDFium; Apache/BSD) — the same
# renderer the Hermes pdf skill recommends as its PyMuPDF replacement.
# Office formats additionally need LibreOffice (`soffice`) on PATH.
documents = ["pypdfium2>=4.30", "pillow>=10"]

# Hermes discovers the plugin through this entry-point group. The key (msteams_call)
# is the plugin name shown in `hermes plugins list` / used in plugins.enabled; the
# value is the import package whose register(ctx) Hermes calls.
[project.entry-points."hermes_agent.plugins"]
msteams_call = "hermes_msteams_bridge"
# Upgrade path for configs written against the published 0.4.0, which named this plugin `teams_call`.
# `plugins.enabled` names the ENTRY-POINT key, so without this a 0.4.0 config does not load the package
# at all on upgrade - the platform alias cannot help, because register() never runs. Same module, so
# enabling either name activates the same plugin; the docs and the installer write msteams_call.
teams_call = "hermes_msteams_bridge"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_msteams_bridge*"]

[tool.setuptools.package-data]
hermes_msteams_bridge = ["plugin.yaml"]
